<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Risk Communication Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: section list on the left, one short section at a time on the right.
   Same colors and fonts as the Response Guide. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunken:#eaf0ef; --ink:#16252a; --muted:#56696e; --line:#d3dddc;
  --accent:#0b6a78; --accent-ink:#ffffff; --accent-soft:#dcedef;
  --silt:#8a5d14; --silt-bg:#f6ecd8; --good:#2c7346; --good-bg:#e1f0e5; --bad:#a3372a; --bad-bg:#f8e4df;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  /* Advisory colors. Change these to match DWQ signs if needed. */
  --t-none:#2c7346; --t-watch:#d9a400; --t-warn:#d4731c; --t-danger:#a3372a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#152124; --sunken:#1b2a2e; --ink:#e2ebe9; --muted:#97abad; --line:#2a3b3f;
  --accent:#55b6c5; --accent-ink:#06252a; --accent-soft:#173439;
  --silt:#dba84f; --silt-bg:#2c2413; --good:#6dc48c; --good-bg:#14281b; --bad:#ec8a78; --bad-bg:#331b16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#152124; --sunken:#1b2a2e; --ink:#e2ebe9; --muted:#97abad; --line:#2a3b3f;
  --accent:#55b6c5; --accent-ink:#06252a; --accent-soft:#173439;
  --silt:#dba84f; --silt-bg:#2c2413; --good:#6dc48c; --good-bg:#14281b; --bad:#ec8a78; --bad-bg:#331b16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
/* Side margins. Raise the middle number in clamp() for more space. */
.wrap{max-width:1440px;margin:0 auto;padding-left:max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,4vw,56px),env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:26px} h3{font-size:18px;font-weight:700}
p{margin:0} a{color:var(--accent)}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
header.top{padding-block:28px 18px;display:flex;flex-direction:column;gap:10px}
.lede{max-width:72ch;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:600 14px/1 var(--f-body);border-radius:var(--r);padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.small,.btn.small{padding:6px 10px;font-size:13px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start;padding-bottom:40px}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
nav.steps{position:sticky;top:12px;display:flex;flex-direction:column;gap:1px;min-width:0}
nav.steps .grp{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
nav.steps .grp:first-child{padding-top:0}
nav.steps button{justify-content:space-between;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:var(--r);font-weight:500;text-align:left;line-height:1.25;color:var(--ink)}
nav.steps button .t{flex:1}
nav.steps button .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
nav.steps button.done .c{color:var(--good)}
nav.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.steps button:hover{background:var(--sunken)}
@media (max-width:760px){
  nav.steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  nav.steps .grp{display:none}
  nav.steps button{width:auto;flex:none;border:1px solid var(--line);background:var(--surface);gap:8px}
}
main.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:22px;min-width:0}
.stage-head{display:flex;flex-direction:column;gap:6px}
.stage-head p{color:var(--muted);max-width:72ch;font-size:16px}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{font:400 15px/1.35 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.two,.three{grid-template-columns:1fr}}

/* Action rows: checkbox, bold action, one short line, optional jump button */
.acts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.act:has(input:checked){background:var(--good-bg);border-color:transparent}
.act input{accent-color:var(--accent);width:19px;height:19px;margin-top:2px;grid-row:span 2;cursor:pointer}
.act b{font-size:16px;font-weight:600;cursor:pointer}
.act .d{grid-column:2;color:var(--muted);font-size:14.5px}
.act .side{grid-column:3;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.act .when{font-family:var(--f-mono);font-size:12px;color:var(--good);white-space:nowrap}

.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.card h3{font-size:19px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.card p{font-size:14.5px;color:var(--muted)}
.card .lbl{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--silt-bg);color:var(--silt);border-color:transparent}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunken);font-weight:600}
tr:last-child td{border-bottom:0}
.key{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:var(--r);font-size:16px}
.key b{color:var(--accent)}
details.why{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
details.why summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";font-family:var(--f-mono);font-weight:500;width:14px}
details.why[open] summary::before{content:"\2013"}
details.why .in{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
details.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.status{font-size:13px;color:var(--good);min-height:1.2em}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.pick,.sits{display:flex;flex-wrap:wrap;gap:6px}
.pick button[aria-pressed="true"],.sits button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Message boxes */
.msg{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.msg-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--sunken)}
.msg-head h4{margin:0;font-size:15px;font-weight:600;font-family:var(--f-body)}
.msg-body{padding:12px 14px;font-size:15px;line-height:1.55;white-space:pre-wrap}
mark.blank{background:var(--silt-bg);color:var(--silt);border-radius:3px;padding:0 3px;font-weight:600}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:14px}
.strip b{font-weight:600}
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 18px}
.fillmeter{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* Advisory levels */
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiers{grid-template-columns:1fr}}
.tiers button{flex-direction:column;align-items:flex-start;gap:6px;padding:14px;text-align:left;line-height:1.35;font-weight:400;border-width:2px;border-top:10px solid var(--tc);min-height:110px}
.tiers button b{font-family:var(--f-display);font-size:21px}
.tiers button span{font-size:14px;color:var(--muted)}
.tiers button[aria-pressed="true"]{border-color:var(--tc);background:var(--accent-soft)}
.t-none{--tc:var(--t-none)}.t-watch{--tc:var(--t-watch)}.t-warn{--tc:var(--t-warn)}.t-danger{--tc:var(--t-danger)}
.tier-detail{border-left:8px solid var(--tc);background:var(--bg);border-radius:var(--r);padding:16px 18px}

/* Message map */
.mm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.mm{grid-template-columns:1fr}}
.mm .col{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.wc{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:10px;border-radius:999px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);width:0}
.bar.over i{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){button,.btn{transition:border-color .15s,background-color .15s}}
@media print{nav.steps,.strip,.toolbar,.foot,button{display:none!important}.layout{display:block}main.stage{border:0;padding:0}details.why{display:none}}
[hidden]{display:none!important}body{margin:0}img{max-width:100%}
.site-nav{background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--f-body)}
.site-nav .in{max-width:1440px;margin:0 auto;padding:10px max(clamp(20px,4vw,56px),env(safe-area-inset-right,0px)) 10px max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.site-nav .brand{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;margin-right:8px}
.site-nav a.nl{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:4px 2px;border-bottom:2px solid transparent}
.site-nav a.nl:hover{color:var(--accent)}
.site-nav a.nl[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
</style>
<script src="config.js"></script>

<div class="wrap">

 ["agency","Issuing agency","e.g., San Juan Public Health and Utah DEQ"],

 ["toxin","Toxin (algal bloom)","e.g., microcystin"],
 ["next","Next update","e.g., 3 p.m. Friday, Oct 30"],
 ["link","Advisory web page","e.g., deq.utah.gov/..."],
 ["phone","Public phone line","e.g., 435-555-0100"]

try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
S=Object.assign(JSON.parse(JSON.stringify(DEF)),S||{});
if(!["none","watch","warn","danger"].includes(S.tier))S.tier="warn";

const H=(k,l)=>S.ev[k]?esc(S.ev[k]):`<mark class="blank">[${esc(l)}]</mark>`;

function evPhrase(f){
 const k=S.ev.kind||"flood";
 if(k==="release")return "a sewage or chemical release";
 if(k==="runoff")return "runoff from the "+f("fire","fire")+" burn scar";
 if(k==="hab")return "a harmful algal bloom";
 return "flooding";

/* ================= CONTENT (edit wording here) =================
   Action items are [action, one short line, section to jump to (optional)]. */
const QUICK=[
 ["Confirm who speaks","Health department or tribal health agency for advisories; DEQ Communications coordinates; the JIC if one is open.","lead"],
 ["Fill in the event details","Water, reach, dates and next update time. Every message fills in from them.","event"],
 ["Pick the advisory level","Health Watch, Warning Advisory or Danger Advisory, with the health department.","levels"],
 ["Send the holding statement","Clear it within one hour with the DWQ technical reviewer, DEQ PIO and health department.","holding"],

/* Ready-made materials from the Recreational Water Quality Strategic Communication Workgroup (2026 HAB Communications Strategy). */
const MATERIALS=[
 ["Dog owners","Your Dog and Harmful Algae tri-fold","https://lf-public.deq.utah.gov/WebLink/ElectronicFile.aspx?docid=554840&eqdocs=DWQ-2025-003445&dbid=0&repo=Public"],
 ["Parents","Your Kids and Harmful Algae tri-fold","https://lf-public.deq.utah.gov/WebLink/ElectronicFile.aspx?docid=611596&eqdocs=DWQ-2025-003816"],

 ["Gardeners and farmers","HAB risks to food in Utah (USU Extension)","https://extension.usu.edu/foodsafety/research/harmful-algal-blooms-risks-for-food-in-utah"],

 ["Partners","Temporary advisory signs and social media images (DWQ)","https://deq.utah.gov/dwq/habs-waterborne-pathogens-signage"]
];

];

 try{await navigator.clipboard.writeText(txt);ok=true}catch(e){
  try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e2){}}
 if(btn){const o=btn.textContent;btn.textContent=ok?"Copied":"Select and copy";setTimeout(()=>btn.textContent=o,1500)}

 {id:"holding",t:"Holding statement and release",render(){
  const M=msgs();
  return head("Holding statement and news release","Holding statement within the first hour; joint news release within 24 hours.")+strip()+
  `<div class="two"><div class="block"><h3>Holding statement</h3>${msgBox("hold","First hour",M.hold(H),M.hold(T),`<span class="chip">${words(M.hold(T))} words</span>`)}</div>
   <div class="block"><h3>News release draft</h3>${msgBox("nr","By 24 hours",M.nr(H),M.nr(T))}</div></div>`}},
 {id:"social",t:"Social posts",render(){
  const M=msgs();
  return head("Social posts","Post on every partner account at once, with a map or photo, alt text and the advisory link. The advisory post uses the level picked under Advisory levels.")+strip()+
  `<div class="two">${M.posts.map((p,i)=>{const t=p[1](T);return msgBox("post"+i,p[0],p[1](H),t,`<span class="chip ${t.length>280?"warn":""}">${t.length} characters</span>`)}).join("")}</div>`}},
 {id:"qa",t:"Q&A",count:()=>[QA.filter((q,i)=>(S.qa[i]||"").trim()).length,QA.length],render(){
  return head("Q&A","Write the approved answers, then copy them to the shared message file.")+
  `<div class="two">${QA.map((q,i)=>`<div class="field"><label for="qa${i}">${esc(q)}</label><textarea id="qa${i}" data-qa="${i}" rows="3">${esc(S.qa[i]||"")}</textarea></div>`).join("")}</div>
   <div class="inline"><button type="button" class="small primary" id="qaCopy">Copy Q&amp;A</button></div>`}},
 {id:"map",t:"Message map",render(){
  const m=S.map,tot=m.k.reduce((a,k)=>a+words(k),0);
  return head("Message map","One question, three key messages (27 words or fewer together), three facts under each.")+
  `<div class="field"><label for="mq">Question people are asking</label><input type="text" id="mq" data-map="q" value="${esc(m.q)}" placeholder="e.g., Is it safe to be in the river after the flood?"></div>
   <div class="meter"><span class="lbl">Key messages: <span id="mmTot">${tot}</span> of 27 words</span><span class="bar ${tot>27?"over":""}" id="mmBar"><i style="width:${Math.min(100,tot/27*100)}%"></i></span></div>
   <div class="mm">${[0,1,2].map(i=>`<div class="col"><div class="field"><label for="mk${i}">Key message ${i+1}</label><textarea id="mk${i}" data-map="k${i}" rows="2">${esc(m.k[i])}</textarea><span class="wc" id="wc${i}">${words(m.k[i])} words</span></div>${[0,1,2].map(j=>`<div class="field"><label for="mf${i}${j}">Fact ${j+1}</label><input type="text" id="mf${i}${j}" data-map="f${i}${j}" value="${esc(m.f[i][j])}"></div>`).join("")}</div>`).join("")}</div>
   <div class="inline"><button type="button" class="small" id="mmExample">Load flood example</button><button type="button" class="small primary" id="mmCopy">Copy map</button><button type="button" class="small ghost" id="mmClear">Clear</button></div>
   ${why("How to build and deliver a map",`<ul><li>List audiences and their questions (swim? fish? irrigate? drink?). Start with the questions most audiences share.</li><li>Facts: results, dates, what agencies are doing.</li><li>Test it with an expert who didn't write it, and with partners.</li><li>Deliver as “tell me, tell me more, tell me again”: key messages, facts, key messages.</li><li>Pair each negative with about three positive or action messages. Bridge back when questions wander: “What's most important to know is …”</li></ul>`)}`}},
 {g:"Manage",id:"clear",t:"Clearance and spokespeople",count:()=>[countFor("clr",CLEAR.length),CLEAR.length],render(){
  return head("Clearance and spokespeople","Send each message to all reviewers at once. One-hour turnaround.")+
  `<div class="two"><div class="block"><h3>Clear the message</h3>${acts("clr",CLEAR)}<p class="note">No reply in an hour counts as approval, for holding statements and routine updates only.</p></div>
   <div class="block"><h3>Name spokespeople at the first call</h3>${acts("spk",[["Health officer or designee","Health advisories"],["DWQ scientist","What the data show"],["JIC spokesperson","When a JIC is open"]])}<p class="note">Stay in your lane; refer other questions to the right partner.</p></div></div>
   <div class="block"><h3>On camera</h3><div class="scroll"><table><thead><tr><th>Do</th><th>Don't</th></tr></thead><tbody>${DOS.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></div>`}},
 {id:"rumor",t:"Rumor log",render(){
  return head("Rumor and inquiry log","Log it, answer it with the approved wording, and add repeat questions to the Q&A.")+
  `<div class="grid"><div class="field"><label for="rlSrc">Source</label><select id="rlSrc"><option>Phone</option><option>Social media</option><option>Field</option><option>Media</option><option>Email</option><option>Other</option></select></div><div class="field"><label for="rlBy">Answered by</label><input type="text" id="rlBy"></div></div>
   <div class="two"><div class="field"><label for="rlQ">Question or rumor</label><textarea id="rlQ" rows="2"></textarea></div><div class="field"><label for="rlA">Approved answer</label><textarea id="rlA" rows="2"></textarea></div></div>
   <div class="inline"><button type="button" class="primary small" id="rlAdd">Add to log</button><button type="button" class="small" id="rlCopy">Copy log</button><button type="button" class="small" id="rlCsv">Download CSV</button><span class="status" id="rlStatus" role="status"></span></div>
   ${S.rumors.length?`<div class="scroll"><table><thead><tr><th>When</th><th>Source</th><th>Question or rumor</th><th>Approved answer</th><th>By</th><th></th></tr></thead><tbody>${S.rumors.map((r,i)=>`<tr><td style="white-space:nowrap">${esc(r.when)}</td><td>${esc(r.src)}</td><td>${esc(r.q)}</td><td>${esc(r.a)}</td><td>${esc(r.by)}</td><td><button type="button" class="small ghost" data-rdel="${i}">Delete</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="note">No entries yet. Saved in this browser.</p>`}`}},
 {id:"eval",t:"After the event",count:()=>[countFor("ev",EVAL.length),EVAL.length],render(){
  return head("After the event","Review within 90 days with all partners.")+acts("ev",EVAL)}},
 {id:"prep",t:"Between events",count:()=>[countFor("cy",CYCLE.length)+countFor("op",OPEN.length),CYCLE.length+OPEN.length],render(){
  return head("Between events","Before each monsoon and runoff season, for each basin.")+
  `<div class="two"><div class="block"><h3>Settle with partners</h3>${acts("op",OPEN)}</div><div class="block"><h3>Planning cycle</h3>${acts("cy",CYCLE)}</div></div>`}},
 {id:"sources",t:"Sources",render(){
  return head("Sources","")+
  `<ul style="padding-left:20px;display:flex;flex-direction:column;gap:10px;margin:0">
   <li>Utah DWQ. <a href="https://deq.utah.gov/dwq/recreational-water-quality" target="_blank" rel="noopener">Recreational water quality</a> (advisory levels and public guidance).</li>
   <li>Utah DEQ. <a href="https://deq.utah.gov/dwq/health-advisory-waterborne-pathogens" target="_blank" rel="noopener">Recreational health advisory guidance for waterborne pathogens</a> (E. coli advisory value, 24-hour resample, two-week lift).</li>
   <li>Utah DEQ. <a href="https://deq.utah.gov/health-advisory-panel/harmful-algal-blooms-habs/recreational-health-advisory-guidance-for-harmful-algal-blooms" target="_blank" rel="noopener">Recreational health advisory guidance for harmful algal blooms</a> (toxin thresholds, lifting advisories).</li>
   <li>Recreational Water Quality Strategic Communication Workgroup (2026). <i>2026 Harmful Algal Bloom (HAB) Communications Strategy</i> (draft, internal): workgroup roles, core messages, audiences, materials and success measures.</li>
   <li>Utah DEQ. <a href="https://deq.utah.gov/water-quality/contact-information-harmful-algal-blooms" target="_blank" rel="noopener">Contact information: harmful algal blooms</a> (DEQ Spill Line, Utah Poison Control).</li>
   <li>Covello, V.T. (2006). Risk communication and message mapping. <i>Journal of Emergency Management</i> 4(3).</li>
   <li>Interstate Technology and Regulatory Council (2020). <a href="https://rct-1.itrcweb.org" target="_blank" rel="noopener">Risk Communication Toolkit</a>.</li>
   <li>EPA (2007). <i>Risk Communication in Action: The Risk Communication Workbook.</i> EPA/625/R-05/003.</li>
   <li>CDC. <a href="https://blogs.cdc.gov/publichealthmatters/2015/06/cdcs-cerc-program-principles-to-communicate-by-in-an-emergency-response-and-everyday-life" target="_blank" rel="noopener">Crisis and Emergency Risk Communication (CERC) principles</a>.</li></ul>`}}
];

/* ================= RENDER ================= */
function renderNav(){
 $("#steps").innerHTML=SECTIONS.map(s=>{const c=s.count?s.count():null;
  return (s.g?`<div class="grp">${esc(s.g)}</div>`:"")+`<button type="button" data-sec="${s.id}" class="${c&&c[1]&&c[0]===c[1]?"done":""}"${s.id===S.sec?' aria-current="step"':""}><span class="t">${esc(s.t)}</span>${c?`<span class="c">${c[0]}/${c[1]}</span>`:""}</button>`}).join("");
}
function renderStage(focus){
 COPY={};
 let i=SECTIONS.findIndex(s=>s.id===S.sec);if(i<0){i=0;S.sec=SECTIONS[0].id}
 const s=SECTIONS[i],prev=SECTIONS[i-1],next=SECTIONS[i+1];
 $("#stage").innerHTML=s.render()+`<div class="foot"><span>${prev?`<button type="button" data-sec="${prev.id}">← ${esc(prev.t)}</button>`:""}</span><span>${next?`<button type="button" class="primary" data-sec="${next.id}">${esc(next.t)} →</button>`:""}</span></div>`;
 if(focus){$("#stage").focus({preventScroll:true});const r=$("#stage").getBoundingClientRect();if(r.top<0)window.scrollTo({top:window.scrollY+r.top-12})}
}
function fillMeter(){const el=$("#fillMeter");if(el)el.textContent=fillText()}
function all(){renderNav();renderStage()}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.sec){S.sec=b.dataset.sec;save();renderNav();renderStage(true);return}
 if(b.dataset.copy){copyText(COPY[b.dataset.copy]||"",b);return}
 if(b.dataset.agency){S.agency=+b.dataset.agency;save();renderStage();return}
 if(b.dataset.sit){S.sit=b.dataset.sit;save();renderStage();return}
 if(b.dataset.tier){S.tier=b.dataset.tier;save();renderStage();return}
 if(b.dataset.rdel){S.rumors.splice(+b.dataset.rdel,1);save();renderStage();return}
 switch(b.id){
  case "printBtn":window.print();break;
  case "resetBtn":if(confirmReset()){S=JSON.parse(JSON.stringify(DEF));save();all()}break;
  case "evClear":S.ev={kind:"flood"};save();all();break;
  case "qaCopy":copyText(QA.map((q,i)=>"Q: "+q+"\nA: "+(S.qa[i]||"[approved answer]")).join("\n\n"),b);break;
  case "mmExample":S.map={q:"Is it safe to be in the river after the flood?",
    k:[`Stay out of the river below ${T("from","place")} for now.`,"Crews test the water every few days.","Normal use resumes once tests pass."],
    f:[[`Floodwater carried sewage from ${T("facility","facility")} on ${T("date","date")}.`,"Bacteria can make people sick through cuts or swallowed water.",`The health department issued an advisory on ${T("date","date")}.`],
       ["DWQ sampled [n] sites on [dates].","Results go to the health department the same day.","The advisory page shows each new result."],
       ["Two weeks of passing results are needed.","The health department lifts the advisory.",`The next update is ${T("next","date")}.`]]};save();renderStage();break;
  case "mmClear":S.map=JSON.parse(JSON.stringify(DEF.map));save();renderStage();break;
  case "mmCopy":{const m=S.map;copyText("QUESTION: "+(m.q||"[question]")+"\n\n"+m.k.map((k,i)=>"KEY MESSAGE "+(i+1)+": "+(k||"[ ]")+"\n"+m.f[i].map(f=>"  - "+(f||"[ ]")).join("\n")).join("\n\n"),b);break}
  case "rlAdd":{const q=$("#rlQ").value.trim();if(!q){$("#rlStatus").textContent="Enter the question or rumor.";return}
    S.rumors.unshift({when:stamp(),src:$("#rlSrc").value,q,a:$("#rlA").value.trim(),by:$("#rlBy").value.trim()});save();renderStage();$("#rlStatus").textContent="Added.";break}
  case "rlCopy":copyText(S.rumors.map(r=>[r.when,r.src,r.q,r.a,r.by].join("\t")).join("\n"),b);break;
  case "rlCsv":{const c=v=>'"'+String(v||"").replace(/"/g,'""')+'"';const csv=["When,Source,Question or rumor,Approved answer,Answered by"].concat(S.rumors.map(r=>[r.when,r.src,r.q,r.a,r.by].map(c).join(","))).join("\r\n");
    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));const a=document.createElement("a");a.href=url;a.download="rumor-and-inquiry-log.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);break}
 }
});
let resetArmed=0;
function confirmReset(){const b=$("#resetBtn");if(Date.now()-resetArmed<4000){b.textContent="Start a new event";return true}resetArmed=Date.now();b.textContent="Click again to clear everything";setTimeout(()=>{b.textContent="Start a new event"},4000);return false}
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.ck){if(t.checked)S.checks[t.dataset.ck]=stamp();else delete S.checks[t.dataset.ck];save();
  const row=t.closest(".act"),w=row&&row.querySelector(".when");if(w)w.textContent=S.checks[t.dataset.ck]||"";renderNav();
  if(S.sec==="timeline")renderStage();return}
 if(t.dataset.ev&&t.tagName==="SELECT"){S.ev[t.dataset.ev]=t.value;save()}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.ev&&t.tagName==="INPUT"){S.ev[t.dataset.ev]=t.value.trim();save();fillMeter();clearTimeout(window.__evT);window.__evT=setTimeout(renderNav,300);return}
 if(t.dataset.qa!==undefined){S.qa[t.dataset.qa]=t.value;save();clearTimeout(window.__qaT);window.__qaT=setTimeout(renderNav,300);return}
 if(t.dataset.map){const k=t.dataset.map;
  if(k==="q")S.map.q=t.value;
  else if(k[0]==="k"){S.map.k[+k[1]]=t.value;const w=$("#wc"+k[1]);if(w)w.textContent=words(t.value)+" words"}
  else S.map.f[+k[1]][+k[2]]=t.value;
  save();const tot=S.map.k.reduce((a,x)=>a+words(x),0);const tt=$("#mmTot"),bar=$("#mmBar");if(tt){tt.textContent=tot;bar.classList.toggle("over",tot>27);bar.firstElementChild.style.width=Math.min(100,tot/27*100)+"%"}}
});
all();
})();
</script>
</body>
</html>

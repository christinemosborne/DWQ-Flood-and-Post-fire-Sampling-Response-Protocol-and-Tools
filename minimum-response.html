<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minimum Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Minimum Flood Response: the scaled-down plan from the flood protocol's appendix.
   Same colors and fonts as the other tools. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunken:#eaf0ef; --ink:#16252a; --muted:#56696e; --line:#d3dddc;
  --accent:#0b6a78; --accent-ink:#ffffff; --accent-soft:#dcedef;
  --silt:#8a5d14; --silt-bg:#f6ecd8; --good:#2c7346; --good-bg:#e1f0e5; --bad:#a3372a; --bad-bg:#f8e4df;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#152124; --sunken:#1b2a2e; --ink:#e2ebe9; --muted:#97abad; --line:#2a3b3f;
  --accent:#55b6c5; --accent-ink:#06252a; --accent-soft:#173439;
  --silt:#dba84f; --silt-bg:#2c2413; --good:#6dc48c; --good-bg:#14281b; --bad:#ec8a78; --bad-bg:#331b16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#152124; --sunken:#1b2a2e; --ink:#e2ebe9; --muted:#97abad; --line:#2a3b3f;
  --accent:#55b6c5; --accent-ink:#06252a; --accent-soft:#173439;
  --silt:#dba84f; --silt-bg:#2c2413; --good:#6dc48c; --good-bg:#14281b; --bad:#ec8a78; --bad-bg:#331b16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
/* Side margins. Raise the middle number in clamp() for more space. */
.wrap{max-width:1440px;margin:0 auto;padding-left:max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,4vw,56px),env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:26px} h3{font-size:18px}
p{margin:0} a{color:var(--accent)}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header.top{padding-block:28px 18px;display:flex;flex-direction:column;gap:10px}
.lede{max-width:76ch;color:var(--muted)}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);width:max-content;max-width:100%}
.modes button{border:0;border-radius:999px;padding:8px 18px;font-size:14.5px;background:transparent}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:600 14px/1 var(--f-body);border-radius:var(--r);padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.small,.btn.small{padding:6px 10px;font-size:13px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start;padding-bottom:40px}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
nav.steps{position:sticky;top:12px;display:flex;flex-direction:column;gap:1px;min-width:0}
nav.steps button{justify-content:space-between;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:var(--r);font-weight:500;text-align:left;line-height:1.25;color:var(--ink);gap:10px}
nav.steps button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:18px}
nav.steps button .t{flex:1}
nav.steps button .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
nav.steps button.done .c{color:var(--good)}
nav.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.steps button:hover{background:var(--sunken)}
@media (max-width:760px){
  nav.steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  nav.steps button{width:auto;flex:none;border:1px solid var(--line);background:var(--surface)}
}
main.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:22px;min-width:0}
.stage-head{display:flex;flex-direction:column;gap:6px}
.stage-head p{color:var(--muted);max-width:76ch;font-size:16px}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{font:400 15px/1.35 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.two,.three,.four{grid-template-columns:1fr}}

/* Choice cards */
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.choice{grid-template-columns:1fr}}
.choice button{flex-direction:column;align-items:flex-start;gap:6px;padding:16px;text-align:left;line-height:1.4;font-weight:400;border-width:2px}
.choice button b{font-family:var(--f-display);font-size:20px}
.choice button span{font-size:14.5px;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* Action rows */
.acts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.act:has(input:checked){background:var(--good-bg);border-color:transparent}
.acts.warn .act:has(input:checked){background:var(--bad-bg)}
.act input{accent-color:var(--accent);width:19px;height:19px;margin-top:2px;grid-row:span 2;cursor:pointer}
.act b{font-size:16px;font-weight:600;cursor:pointer}
.act .d{grid-column:2;color:var(--muted);font-size:14.5px}
.act .side{grid-column:3;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.act .when{font-family:var(--f-mono);font-size:12px;color:var(--good);white-space:nowrap}

.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:19px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.card .lbl{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.card.off{opacity:.65;border-style:dashed}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap;display:inline-block}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--silt-bg);color:var(--silt);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunken);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--sunken)}
.banner{border-radius:var(--r);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;font-size:16px}
.banner.ok{background:var(--good-bg);border-left:5px solid var(--good)}
.banner.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.banner b{font-family:var(--f-display);font-size:20px}
.key{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:var(--r)}
details.why{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
details.why summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";font-family:var(--f-mono);width:14px}
details.why[open] summary::before{content:"\2013"}
details.why .in{padding:0 16px 14px;font-size:14.5px}
details.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.sitebox{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(0,1fr) auto;gap:10px 14px;align-items:end;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.sitebox .nm b{font-family:var(--f-display);font-size:19px;display:block}
.sitebox .nm span{font-size:13.5px;color:var(--muted)}
.sitebox.covered{border-style:dashed}
.sitebox .pc{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;padding-bottom:8px}
.sitebox .pc input{accent-color:var(--accent);width:17px;height:17px}
.sitebox .pname{grid-column:2 / -1}
@media (max-width:900px){.sitebox{grid-template-columns:1fr}.sitebox .pname{grid-column:auto}}
.visit{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.visit-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--sunken)}
.visit-head h3{font-size:19px}
.visit-head .dt{font-family:var(--f-mono);font-size:13.5px;color:var(--accent);font-weight:500}
.visit-head label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.visit-head input{accent-color:var(--accent);width:18px;height:18px}
.visit.done .visit-head{background:var(--good-bg)}
.pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:520px;overflow:auto}
@media (prefers-reduced-motion:no-preference){button,.btn{transition:border-color .15s,background-color .15s}}
@media print{nav.steps,.toolbar,.foot,button,.site-nav{display:none!important}.layout{display:block}main.stage{border:0;padding:0}.pre{max-height:none;border:0}}
[hidden]{display:none!important}body{margin:0}img{max-width:100%}
.site-nav{background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--f-body)}
.site-nav .in{max-width:1440px;margin:0 auto;padding:10px max(clamp(20px,4vw,56px),env(safe-area-inset-right,0px)) 10px max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.site-nav .brand{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;margin-right:8px}
.site-nav a.nl{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:4px 2px;border-bottom:2px solid transparent}
.site-nav a.nl:hover{color:var(--accent)}
.site-nav a.nl[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
</style>
<script src="config.js"></script>
</head>

<script src="nav.js" data-root="" data-current="min"></script>
<div class="wrap">
<header class="top">
  <span class="eyebrow">Utah DWQ · Response with limited time, staff and lab budget</span>
  <div class="modes" role="group" aria-label="Event type"><button type="button" data-mode="flood" aria-pressed="true">Flood</button><button type="button" data-mode="fire" aria-pressed="false">Post-fire runoff</button></div>
  <h1 id="pageTitle">Minimum Flood Response</h1>
  <p class="lede" id="pageLede"></p>
  <div class="toolbar">
    <a class="btn small" href="response-guide.html">Full Response Guide</a>
    <a class="btn small" href="data-hub.html">Shared Data Hub</a>
    <a class="btn small" href="sap-builder.html">SAP Builder</a>
    <button type="button" class="small ghost" id="printBtn">Print this section</button>
    <button type="button" class="small ghost" id="resetBtn">Start a new event</button>
  </div>
</header>

  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <main class="stage" id="stage" tabindex="-1"></main>

<script>
(function(){
"use strict";
const KEY="dwq-minimum-response-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"$"+(Math.round(v*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const EC_ADV=235; // MPN/100 mL, Utah recreation advisory value used in the protocols

/* ================= CONTENT (edit wording here) ================= */
const M={
 flood:{
  title:"Minimum Flood Response",
  lede:"The scaled-down sampling plan from the flood protocol: four sites, two full visits, then <i>E. coli</i> only until results clear. About $545 in lab fees and 8 person-days. Everything else in the protocol still applies.",
  fitIntro:"Use the minimum plan for Level 1 and Level 2 floods. Tick anything that applies; any one means step up to the full protocol.",
  stepup:[
   ["Several facilities overwhelmed","More than one plant bypassing or overflowing"],
   ["Chemical or fuel release","Spill, tank failure or hazardous material in floodwaters"],
   ["Fish kill, sheen or odor","Seen at any site"],
   ["Interstate or tribal-water impact","The release or plume reaches another state's or a tribe's waters"],
   ["DEM emergency declaration",""],
   ["DO below the minimum criterion below the release","From sondes or field readings"],
   ["A drinking water intake may be affected","DDW and the water system lead"]],
  sites:[
   {k:"U",name:"Upstream boundary",where:"Where the river enters Utah or the affected reach"},
   {k:"R",name:"Below the release",where:"Below the largest overflowing plant or source, after mixing",release:true},
   {k:"P",name:"Use point",where:"Most-used swimming area, boat ramp, irrigation diversion or stock watering area"},
   {k:"D",name:"Downstream end",where:"Above the next reservoir or the state line"}],
  prep:[
   ["Get the bypass and overflow list","Locations, start and end times and volumes from the permitting authority, in Utah and upstream."],
   ["Call health departments and tribes","River contact, livestock watering and irrigation along the reach."],
   ["Check the Shared Data Hub","Post DWQ's planned sites; drop any site a partner already covers."],
   ["Leave the facility to C&E","C&E and the Spills Coordinator sample at the plant under their own budget."],
   ["Pull USGS gages and download sondes","Fix the peak and recession; existing sensors show the pulse at no lab cost."],
   ["Alert UPHL and book the E. coli incubator","E. coli must be in the incubator within 8 hours."],
   ["Start the event log","Record any missed sampling windows."]],
  limits:["It can't separate sources when several facilities release at once.","It can't estimate loads or track the full recovery curve.","It won't meet Integrated Report sample minimums (10 samples for conventional parameters, 4 for toxics), so event data support advisories and the event record, not 303(d) decisions on their own.","Missed peak samples can't be recovered. Record missed windows in the event log."],
  stretch:["Use partners' samples first and drop any site someone else covers.","Let C&E cover the facility under their own lab budget.","Download existing sondes and miniDOTs instead of sampling.","Stop a site once two visits in a row meet criteria.","Pair visit 2 or the weekly E. coli runs with scheduled ambient monitoring.","Ask EPA, USGS or a grant-funded partner network for support early in a major event."],
  metalsDefault:""
 },
 fire:{
  title:"Minimum Post-Fire Response",
  lede:"The scaled-down sampling plan for post-fire runoff: three sites, a baseline visit, the first two storms that meet the trigger, and one end-of-season check. About $1,960 in lab fees and 9 person-days. Everything else in the post-fire guidance still applies.",
  fitIntro:"Use the minimum plan when sondes, autosamplers and every-storm sampling aren't possible. Tick anything that applies; any one means step up to the full post-fire response.",
  stepup:[
   ["DO below 2 mg/L or a fish kill","Below the burn"],
   ["Debris flow reaching a stream or lake","Or turbidity off-scale (above 4,000 FNU)"],
   ["Metals above acute aquatic life criteria","Or above Class 1C criteria near an intake"],
   ["A drinking water intake below the burn may be affected","DDW and the water system lead"],
   ["Listed or sensitive species below the burn","DWR leads on fisheries; more sampling is likely needed"],
   ["BAER, EPA or a partner offers sensors, lab or staff support","Use it: the full program becomes affordable"]],
  sites:[
   {k:"B",name:"Below the burn",where:"Main stream draining the burn, above the first downstream use (Tier 1)"},
   {k:"P",name:"Use point",where:"First downstream intake, diversion, fishery or recreation area"},
   {k:"G",name:"Baseline gage",where:"Existing USGS gage or DWQ ambient site with pre-fire data (Tier 2)"}],
  prep:[
   ["Get the burn severity map and BAER status","Or the USGS debris-flow assessment while BAER is pending."],
   ["Ask NWS for the burn's flash-flood rainfall threshold","That's the trigger for storm sampling."],
   ["Alert DWR and DDW","Fisheries below the burn; water systems with intakes downstream."],
   ["Check the Shared Data Hub and USGS","Use partner sites and existing sensors; drop any site someone else covers."],
   ["Confirm safe access and a backup station","Burned slopes and roads fail in storms. Pick a downstream backup."],
   ["Alert UPHL to storm samples","Shortest holds: E. coli 8 hours; lab turbidity 48 hours."],
   ["Start the incident log","Record storm dates, rainfall and any missed storms."]],
  limits:["Without sondes or autosamplers it misses storm peaks; grab samples show the falling limb only.","Without an unburned reference it can't separate fire effects from a wet or dry year.","Two storms can't show the full first season or when the stream has recovered.","It won't meet Integrated Report sample minimums, so data support alerts and the event record, not 303(d) decisions on their own."],
  stretch:["Download any existing USGS or water-system sondes; ask water systems to share raw-water turbidity.","Use partner sites (USGS, the land manager, tribes, water systems) and drop any site someone else covers.","Combine the baseline visit with BAER or land-manager field days.","Pair the end-of-season check with scheduled ambient monitoring.","Ask BAER, NRCS (EWP) or a grant-funded network to fund sensors or extra storms."],
  metalsDefault:"Al, As, Cu, Fe, Mn, Pb, Zn"
 }
};
const FIRE_TRIGGERS=["NWS Flash Flood Watch or Warning for the burn scar","Rainfall at the burn's USGS or NWS debris-flow threshold","No threshold yet: about 0.25 in (6 mm) in 15 minutes, 0.4 in/hr over an hour, or monsoon storms tracking over the burn"];

/* ================= STATE ================= */
const blankSite=()=>({name:"",id:"",partner:false,pname:""});
const DEF={mode:"flood",sec:"fit",
 flood:{type:"release",stepup:{},prep:{},done:{},ev:{name:"",water:"",peak:"",lead:"",lab:"Utah Public Health Laboratory (State Lab)"},metals:false,metalList:"",weekly:2},
 fire:{stepup:{},prep:{},done:{},ev:{name:"",water:"",contain:"",lead:"",lab:"Utah Public Health Laboratory (State Lab)"},rec:true,metalList:M.fire.metalsDefault,storms:["",""]},
 sites:{U:blankSite(),R:blankSite(),P:blankSite(),D:blankSite(),B:blankSite(),G:blankSite()},
 prices:{tss:15,nut:65,met:13.2},ec:{U:[],R:[],P:[],D:[],B:[],G:[]}};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
function merge(d,s){if(!s||typeof s!=="object"||Array.isArray(s))return s===undefined?d:s;const o={...d};for(const k in s)o[k]=(d&&typeof d[k]==="object"&&!Array.isArray(d[k]))?merge(d[k],s[k]):s[k];return o}
S=merge(JSON.parse(JSON.stringify(DEF)),S||{});
for(const k of Object.keys(DEF.sites)){if(!Array.isArray(S.ec[k]))S.ec[k]=[]}
if(!Array.isArray(S.fire.storms))S.fire.storms=["",""];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const X=()=>S[S.mode];         // the current mode's working state
const C_=()=>M[S.mode];        // the current mode's content

/* ================= LOGIC ================= */
const stepUp=()=>C_().stepup.some((x,i)=>X().stepup[i]);
const activeSites=()=>C_().sites.filter(s=>!(s.release&&S.flood.type!=="release"));
const dwqSites=()=>activeSites().filter(s=>!S.sites[s.k].partner);

const metals=()=>X().metalList.split(/[,;\s]+/).filter(Boolean);

function collect(k,v){

  const m=S.flood.metals&&metals().length>0&&(k==="U"||k==="D");

  if(v==="v2")return {U:["Field","E. coli"],R:["Field","E. coli","Nutrients"],P:["Field","E. coli"],D:["Field","E. coli"]}[k];

 }
 const met=metals().length?["Metals"]:[];
 const T={
  base:{B:["Field","TSS","Nutrients"].concat(met),P:["Field"].concat(ec),G:["Field","Download sensors"]},

function cost(){

 const metUnit=(metals().length+2)*p.met;
 const vs=visits().filter((v,i,a)=>a.findIndex(x=>x.v===v.v)===i&&v.v!=="wk");
 for(const v of vs){
  const has=item=>sites.filter(s=>{const c=collect(s.k,v.v);return c&&c.some(x=>x===item)}).length;
  const t=has("TSS"),n=has("Nutrients"),m=has("Metals");

  const fm=S.mode==="flood"&&m;

 }
 let days,full;

function ecStatus(k){

 if(k==="P"){for(let i=r.length-1;i>0;i--){const a=r[i],b=r[i-1];if(+a.mpn<EC_ADV&&+b.mpn<EC_ADV&&a.date&&b.date&&(new Date(a.date)-new Date(b.date))/864e5>=7)return ["ok","Two results in a row, a week apart, below "+EC_ADV+". Meets the lift rule."]}

}

    <div class="inline"><input type="date" id="ecd_${s.k}" aria-label="Sample date" style="max-width:170px"><input type="number" id="ecv_${s.k}" min="0" step="0.1" placeholder="MPN" aria-label="E. coli MPN per 100 mL" style="max-width:120px"><button type="button" class="small" data-ecadd="${s.k}">Add</button></div></div>`}).join("")}</div>`
   :`<p class="note">No E. coli in this plan. ${S.mode==="fire"?"Turn on “Recreation at the use point” under Event details to add it.":""}</p>`)+
  `<p class="note">Advisory value: ${EC_ADV} MPN/100 mL. Screen other results against criteria in the <a href="response-guide.html">Response Guide</a>.</p>`}},
 {id:"plan",t:"Plan summary",render(){
  return head("Plan summary","Copy it into an email or the event log, or print it for the crew.")+
  `<div class="inline"><button type="button" class="primary small" id="copyPlan">Copy plan</button><button type="button" class="small" id="printPlan">Print</button><a class="btn small" href="sap-builder.html">Need a full SAP? Open the SAP Builder</a></div><div class="pre" id="planText">${esc(planText())}</div>`}}
];
function planText(){
 const C=cost(),L=[],e=X().ev,fl=S.mode==="flood";
 L.push(fl?"MINIMUM FLOOD RESPONSE SAMPLING PLAN":"MINIMUM POST-FIRE RESPONSE SAMPLING PLAN");
 if(fl){L.push(`Event: ${e.name||"[event]"}   River/reach: ${e.water||"[river]"}`);L.push(`Type: ${S.flood.type==="release"?"Flood with a release (Level 2)":"Runoff, no known release (Level 1)"}   Peak: ${e.peak?fdt(new Date(e.peak)):"[peak]"}`)}
 else{L.push(`Fire: ${e.name||"[fire]"}   Streams: ${e.water||"[streams]"}`);L.push(`Containment: ${e.contain?fd(new Date(e.contain+"T12:00")):"[date]"}   Recreation at use point: ${S.fire.rec?"yes":"no"}`)}
 L.push(`Crew lead: ${e.lead||"[name]"}   Lab: ${e.lab||"[lab]"}`);
 if(stepUp())L.push("","STEP UP: a trigger applies. Use the full response: "+C_().stepup.filter((x,i)=>X().stepup[i]).map(x=>x[0]).join("; "));
 L.push("","SITES");
 activeSites().forEach(s=>{const v=S.sites[s.k];L.push(`- ${s.name}: ${v.name||"[site]"}${v.id?" ("+v.id+")":""}${v.partner?" - PARTNER COVERS: "+(v.pname||"[partner]"):""}`)});
 if(!fl)L.push("","STORM TRIGGER: "+FIRE_TRIGGERS.join("; ")+".");
 L.push("","SCHEDULE");
 visits().forEach(v=>{L.push(`${v.title} - ${v.when}${X().done[v.id]?" [done]":""}`);activeSites().forEach(s=>{const c=collect(s.k,v.v),pv=S.sites[s.k];if(pv.partner)return;if(c)L.push(`   ${siteLabel(s)}: ${c.join(", ")}`)});
  if(qaText(v.v))L.push("   QA: "+qaText(v.v))});
 L.push("","NOTES");
 L.push("- E. coli in the incubator within 8 hours."+(fl?" Below the release, add a 1:10 dilution bottle and dilution blank.":""));
 L.push("- Field pH and temperature with every nutrient sample (ammonia criteria).");
 if(metals().length&&(!fl||S.flood.metals))L.push(`- Metals (filtered): ${X().metalList} plus Ca and Mg for hardness.`);
 if(fl||S.fire.rec)L.push(`- Advisory value: E. coli ${EC_ADV} MPN/100 mL. Lift after two results in a row, a week apart, below ${EC_ADV} at the use point.`);
 if(!fl)L.push("- No channel entry during or right after a storm. Two-person crew; burned-area hazard briefing.");
 L.push("","COST");
 C.rows.forEach(r=>L.push(`- ${r[0]}: ${r[1]} x ${money(r[2])} = ${money(r[3])}`));
 L.push(`Lab total: ${money(C.lab)}   Staff: about ${C.days} person-days`);
 L.push("","STEP UP to the full response if: "+C_().stepup.map(x=>x[0].toLowerCase()).join("; ")+".");
 return L.join("\n");
}

/* ================= RENDER ================= */
function renderHead(){
 document.title=C_().title;$("#pageTitle").textContent=C_().title;$("#pageLede").innerHTML=C_().lede;
 document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===S.mode)));
}
function renderNav(){
 $("#steps").innerHTML=SECTIONS.map((s,i)=>{const c=s.count?s.count():null;let tag="",done=false;
  if(c){if(c[0]==="!")tag=`<span class="c" style="color:var(--bad)">!</span>`;else if(c[0]==="ok")tag=`<span class="c" style="color:var(--good)">ok</span>`;else{tag=`<span class="c">${esc(c[0])}</span>`;done=!!c[1]}}
  return `<button type="button" data-sec="${s.id}" class="${done?"done":""}"${s.id===S.sec?' aria-current="step"':""}><span class="n">${i+1}</span><span class="t">${esc(s.t)}</span>${tag}</button>`}).join("");
}
function renderStage(focus){
 let i=SECTIONS.findIndex(s=>s.id===S.sec);if(i<0){i=0;S.sec=SECTIONS[0].id}
 const s=SECTIONS[i],prev=SECTIONS[i-1],next=SECTIONS[i+1];
 $("#stage").innerHTML=s.render()+`<div class="foot"><span>${prev?`<button type="button" data-sec="${prev.id}">← ${esc(prev.t)}</button>`:""}</span><span>${next?`<button type="button" class="primary" data-sec="${next.id}">${esc(next.t)} →</button>`:""}</span></div>`;
 if(focus){$("#stage").focus({preventScroll:true});const r=$("#stage").getBoundingClientRect();if(r.top<0)window.scrollTo({top:window.scrollY+r.top-12})}
}
function all(){renderHead();renderNav();renderStage()}
function keepFocus(fn){const a=document.activeElement&&document.activeElement.id;fn();if(a){const el=document.getElementById(a);if(el){el.focus();if(el.setSelectionRange&&el.type==="text"){const n=el.value.length;el.setSelectionRange(n,n)}}}}

/* ================= EVENTS ================= */
let resetArmed=0;
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.mode){S.mode=b.dataset.mode;save();all();return}
 if(b.dataset.sec){S.sec=b.dataset.sec;save();renderNav();renderStage(true);return}
 if(b.dataset.type){S.flood.type=b.dataset.type;save();all();return}
 if(b.dataset.ecadd){const k=b.dataset.ecadd,d=$("#ecd_"+k).value,v=$("#ecv_"+k).value;if(v===""){$("#ecv_"+k).focus();return}S.ec[k].push({date:d,mpn:v});S.ec[k].sort((a,b)=>(a.date||"").localeCompare(b.date||""));save();all();return}
 if(b.dataset.ecdel){const [k,i]=b.dataset.ecdel.split(":");S.ec[k].splice(+i,1);save();all();return}
 switch(b.id){
  case "printBtn":case "printPlan":window.print();break;
  case "copyPlan":copyText(planText(),b);break;
  case "resetBtn":if(Date.now()-resetArmed<4000){const m=S.mode;S=JSON.parse(JSON.stringify(DEF));S.mode=m;save();b.textContent="Start a new event";all()}else{resetArmed=Date.now();b.textContent="Click again to clear everything";setTimeout(()=>b.textContent="Start a new event",4000)}break;
 }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.ck){const g=t.dataset.ck,i=t.dataset.i;if(t.checked)X()[g][i]=stamp();else delete X()[g][i];save();all();return}
 if(t.dataset.done){if(t.checked)X().done[t.dataset.done]=stamp();else delete X().done[t.dataset.done];save();all();return}
 if(t.dataset.storm){S.fire.storms[+t.dataset.storm]=t.value;save();all();return}
 if(t.dataset.site&&t.dataset.f==="partner"){S.sites[t.dataset.site].partner=t.checked;save();all();return}
 if(t.id==="metOn"){S.flood.metals=t.checked;save();all();return}
 if(t.id==="recOn"){S.fire.rec=t.checked;save();renderNav();return}
 if(t.dataset.ev==="peak"||t.dataset.ev==="contain"){X().ev[t.dataset.ev]=t.value;save();renderNav();return}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.ev&&t.dataset.ev!=="peak"&&t.dataset.ev!=="contain"){X().ev[t.dataset.ev]=t.value;save();clearTimeout(window.__n);window.__n=setTimeout(renderNav,300);return}
 if(t.dataset.site&&t.dataset.f!=="partner"){S.sites[t.dataset.site][t.dataset.f]=t.value;save();clearTimeout(window.__n);window.__n=setTimeout(renderNav,300);return}
 if(t.id==="metList"){X().metalList=t.value;save();clearTimeout(window.__c);window.__c=setTimeout(()=>keepFocus(all),500);return}
 if(t.id==="weekly"){S.flood.weekly=Math.max(0,Math.min(8,parseInt(t.value||"0",10)||0));save();clearTimeout(window.__c);window.__c=setTimeout(()=>keepFocus(all),400);return}
 if(t.dataset.price){const v=parseFloat(t.value);if(!isNaN(v)){S.prices[t.dataset.price]=v;save();clearTimeout(window.__c);window.__c=setTimeout(()=>keepFocus(all),500)}return}
});
all();
})();
</script>
</body>
